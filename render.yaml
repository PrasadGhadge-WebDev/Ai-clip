services:
  # Backend Web Service (Docker runtime ensures FFmpeg & OpenCV libraries are bundled)
  - type: web
    name: clipforge-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MAX_UPLOAD_SIZE_MB
        value: "500"
      - key: RETENTION_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Static Site
  - type: web
    name: clipforge-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: clipforge-backend
          property: host
